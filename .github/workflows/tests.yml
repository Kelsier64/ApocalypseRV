name: Godot tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  tests:
    name: Godot / ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [quick, integration, slow, assets, smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Check runner contracts
        if: matrix.suite == 'quick'
        shell: powershell
        run: ./scripts/test-runner.tests.ps1
      - name: Install pinned Godot
        shell: pwsh
        run: |
          $version = (Get-Content '.godot-version' -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "GODOT_EXE=$destination/Godot_v$version-stable_win64.exe" >> $env:GITHUB_ENV
      - name: Import and run selected suite
        shell: pwsh
        run: |
          $suite = '${{ matrix.suite }}'
          $parameters = @{ Godot = $env:GODOT_EXE; Suite = $suite }
          # Temporary CI-only exclusions for known failing regressions, pending repair.
          # Restore each test by removing its exact name below after its fix passes.
          # Local suites and explicit -TestFilter runs still include these tests.
          $ciSkips = @(
            'test_player_animation'
            'test_raker_bite_pose'
            'test_raker_release_input'
          )
          if ($suite -ne 'smoke') {
            # Let the runner validate the complete catalog before filtering.
            $selection = @(./scripts/test.ps1 -Suite $suite -List)
            $skipped = @($selection | Where-Object { $_.Name -in $ciSkips })
            foreach ($test in $skipped) {
              $message = "SKIP (CI only): $($test.Name) - known failing regression; pending repair."
              Write-Host $message
              $message >> $env:GITHUB_STEP_SUMMARY
            }
            if ($skipped.Count -gt 0) {
              $parameters.TestFilter = @($selection | Where-Object { $_.Name -notin $ciSkips } | ForEach-Object { "$($_.Name).gd" })
              if ($parameters.TestFilter.Count -eq 0) { throw "CI exclusions would disable the entire $suite suite" }
            }
          }
          ./scripts/test.ps1 @parameters
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-logs-${{ matrix.suite }}
          path: .godot/test-logs/
          include-hidden-files: true
