name: Godot tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: Godot / core
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check runner
        run: ./scripts/test-runner.tests.ps1
      - name: Install pinned Godot
        run: |
          $version = (Get-Content '.godot-version' -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "GODOT_EXE=$destination/Godot_v$version-stable_win64.exe" >> $env:GITHUB_ENV
      - name: Import and run core tests and main scene
        run: ./scripts/test.ps1 -Godot $env:GODOT_EXE
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-logs
          path: .godot/test-logs/
          include-hidden-files: true
